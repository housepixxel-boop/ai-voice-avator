<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Avatar Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a1e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      min-height: 100vh;
    }

    .avatar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0a0a1e;
    }

    #avatarCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.5) 70%, transparent 100%);
      z-index: 10;
    }

    .status {
      font-size: 14px;
      opacity: 0.85;
      min-height: 22px;
      letter-spacing: 0.3px;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    #mic {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(118, 75, 162, 0.5);
      transition: transform 0.2s, opacity 0.2s;
      outline: none;
    }

    #mic:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    #mic:not(:disabled):hover {
      transform: scale(1.08);
    }

    #mic.rec {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }
    }

    #vadToggle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #2d3748, #1a202c);
      color: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.3s;
      outline: none;
      position: relative;
    }

    #vadToggle.active {
      background: linear-gradient(135deg, #48bb78, #38a169);
      color: white;
      box-shadow: 0 6px 20px rgba(72, 187, 120, 0.5);
    }

    #vadToggle.active::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(72, 187, 120, 0.4);
      animation: vadPulse 2s infinite;
    }

    @keyframes vadPulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

    .mode-label {
      font-size: 11px;
      opacity: 0.6;
      text-align: center;
      margin-top: 4px;
    }

    .transcript {
      max-width: 700px;
      width: 90%;
      padding: 12px 18px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      min-height: 44px;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      backdrop-filter: blur(10px);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    video {
      display: none;
    }

    .hidden {
      display: none !important;
    }

    #setupScreen {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 20, 40, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px;
      max-width: 540px;
      width: 90%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      z-index: 100;
      backdrop-filter: blur(20px);
    }

    #setupScreen h2 {
      margin-bottom: 8px;
      font-size: 22px;
      font-weight: 600;
    }

    #setupScreen p {
      opacity: 0.7;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    #topicInput {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    #topicInput:focus {
      border-color: #667eea;
    }

    #startBtn {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      transition: transform 0.2s, opacity 0.2s;
    }

    #startBtn:hover {
      transform: translateY(-1px);
    }

    #startBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .vad-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      font-size: 13px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .vad-indicator.visible {
      opacity: 1;
    }

    .vad-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
      transition: background 0.2s;
    }

    .vad-dot.listening {
      background: #48bb78;
      animation: dotPulse 1.5s infinite;
    }

    .vad-dot.recording {
      background: #ff416c;
      animation: dotPulse 0.8s infinite;
    }

    .vad-dot.processing {
      background: #ecc94b;
    }

    .vad-dot.ai {
      background: #4299e1;
    }

    @keyframes dotPulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }
  </style>
</head>

<body>
  <video id="cam" autoplay playsinline muted></video>
  <div class="avatar"><canvas id="avatarCanvas" width="680" height="680"></canvas></div>
  <div id="vadIndicator" class="vad-indicator">
    <div class="vad-dot" id="vadDot"></div><span id="vadLabel">Idle</span>
  </div>
  <div id="setupScreen">
    <h2>Knowledge Base</h2>
    <p>Paste your knowledge base text below. The AI avatar will only answer questions based on this text.</p>
    <textarea
      id="topicInput">Pixxelhouse offers web development, ecommerce, WordPress, Shopify, mobile apps, and digital branding. Phone: +92-335-325-3513. Email: info@pixxelhouse.com. Address: Main Autobhan Road Near Akbar CNG, Latifabad, Hyderabad.</textarea>
    <button id="startBtn">Start Conversation</button>
  </div>
  <div class="overlay-bottom">
    <div class="transcript" id="transcript">Assistant output will appear here</div>
    <div class="status" id="status">Initializing...</div>
    <div class="controls">
      <div style="display:flex;flex-direction:column;align-items:center;">
        <button id="mic" disabled>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
            <path
              d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
          </svg>
        </button>
        <div class="mode-label">Push to Talk</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;">
        <button id="vadToggle">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a3 3 0 00-3 3v6a3 3 0 006 0V5a3 3 0 00-3-3z" />
            <path d="M19 10v1a7 7 0 01-14 0v-1H3v1a9 9 0 008 8.94V23h2v-2.06A9 9 0 0021 11v-1h-2z" />
          </svg>
        </button>
        <div class="mode-label">Hands-Free</div>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let ws = null, camStream = null, audioCtx = null, analyser = null, mediaRec = null, recording = false;
    let vadAnalyser = null, vadSource = null, vadActive = false, vadInterval = null;
    let vadState = 'idle', vadSpeechStart = 0, vadSilenceStart = 0, vadChunks = [];
    const avCanvas = $('avatarCanvas'), avCtx = avCanvas.getContext('2d');
    function resizeCanvas() {
      avCanvas.width = window.innerWidth;
      avCanvas.height = window.innerHeight;
      drawAvatar(smoothedAmp, blinkAlpha);
    }
    window.addEventListener('resize', resizeCanvas);
    const _bust = `?t=${Date.now()}`;
    const closedImgObj = new Image(); closedImgObj.src = `/images/avatar_closemouth.jpg${_bust}`;
    const openImgObj = new Image(); openImgObj.src = `/images/avatar_openmouth.jpg${_bust}`;
    const closedEyesImgObj = new Image(); closedEyesImgObj.src = `/images/avatar_closeeyes.jpg${_bust}`;
    let smoothedAmp = 0, blinkAlpha = 0, nextBlinkAt = Date.now() + 1500 + Math.random() * 2000, blinkPhase = 0, blinkStartedAt = 0;
    const camCanvas = document.createElement('canvas'); camCanvas.width = 160; camCanvas.height = 120;
    const camCtx = camCanvas.getContext('2d'); let frameTimer = null;
    let audioFormat = null, pcmSampleRate = 24000, nextPlayTime = 0, firstAudioReceived = false;
    const VAD_THRESHOLD = 0.02, VAD_SILENCE_MS = 1200, VAD_MIN_SPEECH_MS = 300, VAD_CHECK_INTERVAL = 100;

    function drawCover(img, ctx, w, h) {
      if (!img.complete || !img.naturalWidth) return false;
      const ir = img.naturalWidth / img.naturalHeight, cr = w / h;
      let sx, sy, sw, sh;
      if (ir > cr) { sh = img.naturalHeight; sw = sh * cr; sx = (img.naturalWidth - sw) / 2; sy = 0; }
      else { sw = img.naturalWidth; sh = sw / cr; sx = 0; sy = (img.naturalHeight - sh) / 2; }
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h); return true;
    }
    function drawAvatar(openAmount, blinkAmount) {
      const w = avCanvas.width, h = avCanvas.height;
      avCtx.clearRect(0, 0, w, h);
      if (!drawCover(closedImgObj, avCtx, w, h)) return;
      if (openAmount > 0.01) { avCtx.globalAlpha = openAmount; drawCover(openImgObj, avCtx, w, h); avCtx.globalAlpha = 1; }
      if (blinkAmount > 0.01 && closedEyesImgObj.complete && closedEyesImgObj.naturalWidth) { avCtx.globalAlpha = blinkAmount; drawCover(closedEyesImgObj, avCtx, w, h); avCtx.globalAlpha = 1; }
    }
    closedImgObj.onload = () => { resizeCanvas(); drawAvatar(0, blinkAlpha); };
    openImgObj.onload = () => { resizeCanvas(); drawAvatar(smoothedAmp, blinkAlpha); };
    closedEyesImgObj.onload = () => { resizeCanvas(); drawAvatar(smoothedAmp, blinkAlpha); };
    function updateBlink() {
      const now = Date.now();
      if (blinkPhase === 0) { if (now >= nextBlinkAt) { if (smoothedAmp < 0.15) { blinkPhase = 1; blinkStartedAt = now; } else { nextBlinkAt = now + 500 + Math.random() * 1000; } } }
      else if (blinkPhase === 1) { const e = now - blinkStartedAt; if (e < 70) { blinkAlpha = e / 70; } else { blinkPhase = 2; } }
      else { const e = now - blinkStartedAt - 70; if (e < 70) { blinkAlpha = 1 - (e / 70); } else { blinkAlpha = 0; blinkPhase = 0; nextBlinkAt = now + 1500 + Math.random() * 2500; } }
    }
    function renderLoop() {
      if (analyser) {
        const data = new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(data);
        let sum = 0; for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
        const rms = Math.sqrt(sum / data.length); let target = Math.min(1, rms * 3.0); if (target < 0.05) target = 0;
        smoothedAmp = smoothedAmp * 0.35 + target * 0.65;
      } else { smoothedAmp = smoothedAmp * 0.3; }
      updateBlink(); drawAvatar(smoothedAmp, blinkAlpha); requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);
    function ensureAnalyser() { if (!analyser && audioCtx) { analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.75; analyser.connect(audioCtx.destination); } }
    function pcmToAudioBuffer(ab, sr) {
      const i16 = new Int16Array(ab), f32 = new Float32Array(i16.length);
      for (let i = 0; i < i16.length; i++) f32[i] = Math.max(-1, Math.min(1, i16[i] / 32768));
      const buf = audioCtx.createBuffer(1, i16.length, sr); buf.getChannelData(0).set(f32); return buf;
    }
    function playAudioBuffer(buf) {
      ensureAnalyser(); const src = audioCtx.createBufferSource(); src.buffer = buf; src.connect(analyser);
      const now = audioCtx.currentTime; const st = Math.max(now, nextPlayTime); src.start(st);
      nextPlayTime = st + buf.duration; if (nextPlayTime < now + 0.05) nextPlayTime = now + 0.01;
    }
    async function playMp3Buffer(ab) { try { const buf = await audioCtx.decodeAudioData(ab); playAudioBuffer(buf); } catch (e) { console.error('[audio] MP3 decode error:', e); } }
    function setVadState(state) {
      vadState = state; const dot = $('vadDot'), label = $('vadLabel');
      dot.className = 'vad-dot';
      if (state === 'listening') { dot.classList.add('listening'); label.textContent = 'Listening'; }
      else if (state === 'recording') { dot.classList.add('recording'); label.textContent = 'Speaking...'; }
      else if (state === 'processing') { dot.classList.add('processing'); label.textContent = 'Processing...'; }
      else if (state === 'ai') { dot.classList.add('ai'); label.textContent = 'AI Speaking'; }
      else { label.textContent = 'Idle'; }
    }
    function startVAD() {
      if (vadActive) return; vadActive = true;
      $('vadToggle').classList.add('active'); $('vadIndicator').classList.add('visible'); $('mic').disabled = true;
      vadChunks = []; vadState = 'idle'; vadSpeechStart = 0; vadSilenceStart = 0;
      if (!vadSource && camStream) {
        const audioStream = new MediaStream(camStream.getAudioTracks());
        vadSource = audioCtx.createMediaStreamSource(audioStream);
        vadAnalyser = audioCtx.createAnalyser(); vadAnalyser.fftSize = 512; vadAnalyser.smoothingTimeConstant = 0.5;
        vadSource.connect(vadAnalyser);
      }
      setVadState('listening'); console.log('[vad] started');
      vadInterval = setInterval(() => {
        if (vadState === 'processing' || vadState === 'ai' || !vadAnalyser) return;
        const data = new Uint8Array(vadAnalyser.fftSize); vadAnalyser.getByteTimeDomainData(data);
        let sum = 0; for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
        const rms = Math.sqrt(sum / data.length); const now = Date.now();
        if (rms > VAD_THRESHOLD) {
          if (vadState === 'listening') { vadSpeechStart = now; setVadState('recording'); startVadRecording(); }
          vadSilenceStart = 0;
        } else if (vadState === 'recording') {
          if (vadSilenceStart === 0) vadSilenceStart = now;
          if (now - vadSilenceStart > VAD_SILENCE_MS) {
            if (now - vadSpeechStart > VAD_MIN_SPEECH_MS) { stopVadRecording(); setVadState('processing'); }
            else { stopVadRecording(); setVadState('listening'); }
          }
        }
      }, VAD_CHECK_INTERVAL);
    }
    function startVadRecording() {
      vadChunks = [];
      const audioStream = new MediaStream(camStream.getAudioTracks());
      mediaRec = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
      mediaRec.ondataavailable = ev => { if (ev.data.size > 0) vadChunks.push(ev.data); };
      mediaRec.onstop = () => {
        const blob = new Blob(vadChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = () => { if (ws && ws.readyState === 1) { ws.send(JSON.stringify({ type: 'mic_start' })); ws.send(reader.result); ws.send(JSON.stringify({ type: 'mic_stop' })); } };
        reader.readAsArrayBuffer(blob);
      };
      mediaRec.start(100); console.log('[vad] recording started');
    }
    function stopVadRecording() { if (mediaRec && mediaRec.state === 'recording') { mediaRec.stop(); console.log('[vad] recording stopped'); } }
    function stopVAD() {
      vadActive = false; $('vadToggle').classList.remove('active'); $('vadIndicator').classList.remove('visible');
      if (vadInterval) { clearInterval(vadInterval); vadInterval = null; }
      if (mediaRec && mediaRec.state === 'recording') mediaRec.stop();
      setVadState('idle'); if (!recording) { $('mic').disabled = false; }
    }
    $('vadToggle').onclick = () => {
      if (!camStream) return;
      if (vadActive) stopVAD();
      else { if (recording) { mediaRec.stop(); recording = false; $('mic').classList.remove('rec'); } startVAD(); }
    };
    $('startBtn').onclick = async () => {
      const topic = $('topicInput').value.trim();
      if (!topic) { alert('Please enter a knowledge base first.'); return; }
      $('startBtn').disabled = true; $('startBtn').textContent = 'Connecting...';
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      ws = new WebSocket(`ws://${location.host}/ws`); ws.binaryType = 'arraybuffer';
      ws.onopen = () => { ws.send(JSON.stringify({ type: 'set_topic', topic: topic })); };
      ws.onmessage = async e => {
        if (e.data instanceof ArrayBuffer) {
          if (!firstAudioReceived) { firstAudioReceived = true; if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume(); }
          if (audioFormat === 'pcm_24000') playAudioBuffer(pcmToAudioBuffer(e.data, pcmSampleRate));
          else if (audioFormat === 'mp3') await playMp3Buffer(e.data);
          else await playMp3Buffer(e.data);
        } else {
          const d = JSON.parse(e.data);
          if (d.type === 'ping') { /* keepalive, ignore */ }
          else if (d.type === 'topic_set') { $('setupScreen').classList.add('hidden'); $('startBtn').disabled = false; $('startBtn').textContent = 'Start Conversation'; status.textContent = 'Requesting camera and mic permission...'; startCamera(); }
          else if (d.type === 'face_detected') { status.textContent = 'Face detected. Greeting you...'; }
          else if (d.type === 'ai_speaking_start') { mic.disabled = true; status.textContent = 'AI speaking...'; firstAudioReceived = false; nextPlayTime = 0; transcript.textContent = '...'; if (vadActive) setVadState('ai'); }
          else if (d.type === 'text_chunk') { if (transcript.textContent === '...') transcript.textContent = ''; transcript.textContent += (d.text || ''); }
          else if (d.type === 'audio_start') { audioFormat = d.format; if (d.sample_rate) pcmSampleRate = d.sample_rate; }
          else if (d.type === 'audio_end') { audioFormat = null; }
          else if (d.type === 'ai_speaking_end') {
            if (nextPlayTime > 0 && audioCtx && nextPlayTime > audioCtx.currentTime) {
              const waitMs = (nextPlayTime - audioCtx.currentTime) * 1000 + 200;
              setTimeout(() => { if (vadActive) setVadState('listening'); else { mic.disabled = false; status.textContent = 'Click mic to speak'; } }, waitMs);
            } else { if (vadActive) setVadState('listening'); else { mic.disabled = false; status.textContent = 'Click mic to speak'; } }
          }
          else if (d.type === 'ignored') { status.textContent = 'Did not catch that. Please try again.'; if (vadActive) setVadState('listening'); else mic.disabled = false; }
          else if (d.type === 'error') { status.textContent = 'Error: ' + d.msg; mic.disabled = false; }
        }
      };
      ws.onerror = () => { status.textContent = 'Connection error. Restart server.'; $('startBtn').disabled = false; $('startBtn').textContent = 'Start Conversation'; };
      ws.onclose = () => { if (status) status.textContent = 'Disconnected.'; stopVAD(); $('startBtn').disabled = false; $('startBtn').textContent = 'Start Conversation'; };
    };
    const cam = $('cam'), mic = $('mic'), status = $('status'), transcript = $('transcript');
    async function startCamera() {
      try {
        camStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 }, audio: true });
        cam.srcObject = camStream; await cam.play();
        status.textContent = 'Looking for your face...'; frameTimer = setInterval(sendFrame, 700);
        mic.disabled = true; mic.onclick = toggleMic;
        setTimeout(() => { if (mic.disabled && !firstAudioReceived) { mic.disabled = false; status.textContent = 'Click mic to speak'; } }, 12000);
      } catch (err) { status.textContent = 'Permission denied: ' + err.message; }
    }
    function sendFrame() {
      if (!camStream || !ws || ws.readyState !== 1) return;
      camCtx.drawImage(cam, 0, 0, camCanvas.width, camCanvas.height);
      const dataUrl = camCanvas.toDataURL('image/jpeg', 0.5);
      ws.send(JSON.stringify({ type: 'frame', data: dataUrl.split(',')[1] }));
    }
    async function toggleMic() {
      if (mic.disabled) return; if (vadActive) stopVAD();
      if (!recording) {
        const audioStream = new MediaStream(camStream.getAudioTracks());
        mediaRec = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
        mediaRec.ondataavailable = ev => { if (ev.data.size > 0 && ws.readyState === 1) ws.send(ev.data); };
        mediaRec.onstop = () => ws.send(JSON.stringify({ type: 'mic_stop' }));
        mediaRec.start(150); recording = true; mic.classList.add('rec'); status.textContent = 'Listening...'; ws.send(JSON.stringify({ type: 'mic_start' }));
      } else { mediaRec.stop(); recording = false; mic.classList.remove('rec'); status.textContent = 'Processing your query...'; mic.disabled = true; }
    }
    window.addEventListener('beforeunload', () => { if (frameTimer) clearInterval(frameTimer); if (vadInterval) clearInterval(vadInterval); if (ws && ws.readyState === 1) ws.close(); });
  </script>
</body>

</html>
